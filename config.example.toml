[admin]
# Bind management HTTP to loopback; Nginx provides public HTTPS.
listen = "127.0.0.1:18080"

[crossplay]
# Translator: external uses a separate Geyser Standalone process (UDP to Java);
# geyserlite is hosted by mc-proxy and does not require a JVM.
enabled = false
provider = "external"
bedrock_listen = "0.0.0.0:19132"
# Geyser's Java address must match a route below and resolve to local mc-proxy.
java_address = "bedrock.example.com"
java_port = 25565
# online / floodgate / offline
auth_type = "online"

# Managed settings for provider = "geyserlite"; ignored in external mode.
[crossplay.geyserlite]
# embedded loads libgeyserlite.so in process; subprocess provides isolation.
mode = "embedded"
# Optional embedded library path; otherwise use GEYSERLITE_LIBRARY, system paths, or download.
# library_path = "/opt/mc-proxy/geyserlite/libgeyserlite.so"
# Optional subprocess executable path; otherwise detect or download it.
# binary_path = "/opt/mc-proxy/geyserlite/geyserlite"
# Offline mode disallows downloads; supply a native library/executable or use geyserlite-embed.
offline = false
motd_line1 = "YvLink"
motd_line2 = "Bedrock via GeyserLite"
# Required only for auth_type = "floodgate": sensitive 16-byte AES-128 key as 32 hex digits.
# floodgate_key = "00112233445566778899aabbccddeeff"

# ViaLite translates Java protocols after YvLink routing and before the real backend.
# Install the native runtime with deploy/install-vialite.sh first. All routes must disable PROXY Protocol.
[via]
enabled = false
# binary_path = "/opt/mc-proxy/vialite/vialite"
runtime_dir = "/run/mc-proxy/vialite"
gate_protocol = "auto"
backend_version = "auto"

[settings]
# All domain routes share this Minecraft Java listener.
listen = "0.0.0.0:25565"
proxy_enabled = true
max_connections = 10000
connect_timeout_ms = 5000
handshake_timeout_ms = 5000
shutdown_grace_secs = 30
copy_buffer_bytes = 32768
socket_buffer_bytes = 1048576
listen_backlog = 4096
tcp_nodelay = true
reuse_port = false
stats_interval_secs = 10

# Routes match in file order; the first matching host selects a route, then strategy selects a backend.
[[rules]]
id = "play"
name = "Survival"
host = "play.example.com"
backend = "10.0.0.2:25565"
# off / v1 / v2; enable only when the backend supports that PROXY Protocol version.
proxy_protocol = "off"
modify_virtual_host = false
whitelist_enabled = true
whitelist = ["Alice", "Bob"]
whitelist_message = "§cYou are not on this server's whitelist."
# Only enabled routes with this set to true can serve global Bedrock crossplay.
crossplay_enabled = false
enabled = true

[rules.health_check]
# tcp checks only the port; minecraft-status also validates Java Status and Ping/Pong.
enabled = true
mode = "minecraft-status"
interval_secs = 30
timeout_ms = 2000
unhealthy_threshold = 3
healthy_threshold = 2
# If omitted, use an exact route host; rewritten or wildcard routes use the backend hostname.
# minecraft_host = "play.example.com"
minecraft_protocol = 769

[rules.status]
# custom generates status locally; backend reads backend status and applies only specified overrides.
mode = "custom"
cache_ttl_secs = 10
motd = "§aSurvival is online\n§7Connected through YvLink"
version_name = "Vanilla 1.21"
# If omitted, use the querying client's protocol number.
# protocol = 767
online = 0
max = 100

[[rules]]
id = "mod"
name = "Modded"
host = ["*.mod.example.com", "mod.example.com"]
backend = ["backend-a.example.com:25565", "backend-b.example.com:25565"]
# sequential / random / round-robin / least-connections / lowest-latency
strategy = "least-connections"
# v2 passes the real client IP to a trusted compatible backend in a binary header.
# Ordinary Minecraft servers do not support this header; keep it off for them.
proxy_protocol = "off"
modify_virtual_host = true
whitelist_enabled = false
whitelist = []
crossplay_enabled = false
enabled = true

[rules.health_check]
enabled = true
mode = "minecraft-status"
interval_secs = 30
timeout_ms = 2000
unhealthy_threshold = 3
healthy_threshold = 2
# Set the required virtual host if needed; forgeData/modinfo Status JSON extensions are accepted.
# minecraft_host = "backend-a.example.com"
minecraft_protocol = 769

# Backend mode preserves Forge/NeoForge forgeData, legacy modinfo, favicon,
# player samples, and unknown Status JSON fields.
[rules.status]
mode = "backend"
cache_ttl_secs = 60
# Optional override; remove or comment out to preserve the backend value.
motd = "§bModded server online"

[rules.status.fallback]
motd = "§cModded server is temporarily offline; please try again later"
version_name = "Backend unavailable"
protocol = -1
online = 0
max = 100

# Keep this last to catch hostnames that matched no earlier route.
[[rules]]
id = "default"
name = "Default route"
host = "*"
backend = "10.0.0.10:25565"
proxy_protocol = "off"
modify_virtual_host = false
whitelist_enabled = false
whitelist = []
crossplay_enabled = false
enabled = true

[rules.health_check]
enabled = false
mode = "tcp"
interval_secs = 30
timeout_ms = 2000
unhealthy_threshold = 3
healthy_threshold = 2
minecraft_protocol = 769
