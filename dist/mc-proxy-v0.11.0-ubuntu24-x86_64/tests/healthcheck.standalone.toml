[admin]
listen = "127.0.0.1:28080"

[settings]
listen = "127.0.0.1:26565"
proxy_enabled = true
socket_buffer_bytes = 0
stats_interval_secs = 60

[[rules]]
id = "health-fixture"
name = "主动健康检查验收"
host = "health.fixture.local"
backend = ["127.0.0.1:29998", "127.0.0.1:29999"]
strategy = "sequential"
proxy_protocol = "off"
modify_virtual_host = false
whitelist_enabled = false
whitelist = []
enabled = true

[rules.health_check]
enabled = true
mode = "tcp"
interval_secs = 1
timeout_ms = 500
unhealthy_threshold = 1
healthy_threshold = 1
minecraft_protocol = 769
